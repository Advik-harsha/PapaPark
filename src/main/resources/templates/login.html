<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <h2>🅿️ SmartPark</h2>
                <p>Sign in to your account</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" name="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="password">Password</label>
                        <a th:href="@{/forgot-password}" style="font-size: 0.8rem; color: var(--accent-primary);">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" class="form-input" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <div class="auth-footer" style="margin-top: 20px; text-align: center;">
                <a th:href="@{/register}" style="color: var(--text-secondary); font-size: 0.9rem;">Don't have an account? <strong style="color: var(--accent-primary);">Sign up</strong></a>
            </div>
        </div>
    </div>
    <div id="alertContainer"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (api.isLoggedIn()) {
                window.location.href = '/dashboard';
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await login(email, password);
            } catch (error) {
                showAlert(error.message || 'Login failed', 'danger');
            }
        }
    </script>
</body>
</html>
