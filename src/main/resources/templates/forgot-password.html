<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-container">
    <div class="auth-card glass-panel">
        <div class="auth-header">
            <div class="brand">
                <span>🅿️</span> SmartPark
            </div>
            <h2>Reset Password</h2>
            <p>Recover your account via OTP verification</p>
        </div>

        <!-- Step 1: Request OTP -->
        <form id="requestOtpForm" onsubmit="requestOtp(event)">
            <div class="form-group">
                <label>Registered Email Address</label>
                <input type="email" id="email" class="form-input" required placeholder="name@example.com">
            </div>
            <button type="submit" id="sendOtpBtn" class="btn btn-primary btn-block">Send Reset OTP</button>
        </form>

        <!-- Step 2: Verify OTP & Reset Password -->
        <form id="resetPasswordForm" onsubmit="resetPassword(event)" style="display: none;">
            <div class="form-group">
                <label>Enter 6-Digit OTP Code</label>
                <input type="text" id="otpCode" class="form-input" style="font-size: 1.3rem; letter-spacing: 4px; text-align: center;" maxlength="6" required placeholder="123456">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" class="form-input" minlength="6" required placeholder="Enter new password">
            </div>
            <button type="submit" class="btn btn-success btn-block">Update Password</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/login" style="color: var(--accent-primary); font-size: 0.9rem;">← Back to Login</a>
        </div>
    </div>

    <div id="alertContainer"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        let targetEmail = '';

        async function requestOtp(e) {
            e.preventDefault();
            targetEmail = document.getElementById('email').value.trim();
            const btn = document.getElementById('sendOtpBtn');
            btn.innerText = 'Sending...';
            btn.disabled = true;

            try {
                const res = await api.post(`/api/auth/forgot-password?email=${encodeURIComponent(targetEmail)}`);
                showAlert(res.message || 'OTP sent to your email', 'success');
                document.getElementById('requestOtpForm').style.display = 'none';
                document.getElementById('resetPasswordForm').style.display = 'block';
            } catch (error) {
                showAlert(error.message || 'Failed to send OTP', 'danger');
                btn.innerText = 'Send Reset OTP';
                btn.disabled = false;
            }
        }

        async function resetPassword(e) {
            e.preventDefault();
            const otp = document.getElementById('otpCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await api.post(`/api/auth/reset-password?email=${encodeURIComponent(targetEmail)}&otp=${encodeURIComponent(otp)}&newPassword=${encodeURIComponent(newPassword)}`);
                showAlert(res.message || 'Password reset successfully!', 'success');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } catch (error) {
                showAlert(error.message || 'Password reset failed', 'danger');
            }
        }
    </script>
</body>
</html>
