<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper">
                <div class="card glass-panel">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>User Management</h3>
                        <div>
                            <input type="text" id="searchBox" placeholder="Search users..." onkeyup="filterUsers()" 
                                   style="padding: 8px 12px; border-radius: 4px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); width: 250px;">
                        </div>
                    </div>
                    <div class="card-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Wallet</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="alertContainer"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        let allUsers = [];

        document.addEventListener('DOMContentLoaded', () => {
            requireAdmin();
            document.getElementById('pageTitle').innerText = 'All Users';
            loadUsers();
        });

        async function loadUsers() {
            try {
                allUsers = await api.get('/api/users/all');
                renderUsers(allUsers);
            } catch (error) {
                console.error(error);
                showAlert(error.message || 'Error loading users', 'danger');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '';
            
            if (users && users.length > 0) {
                users.forEach(u => {
                    const statusClass = !u.blocked ? 'success' : 'danger';
                    const statusText = !u.blocked ? 'ACTIVE' : 'BLOCKED';
                    const actionBtn = !u.blocked 
                        ? `<button class="btn btn-sm btn-danger" onclick="blockUser('${u.id}')">Block</button>`
                        : `<button class="btn btn-sm btn-success" onclick="unblockUser('${u.id}')">Unblock</button>`;
                        
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.fullName}</td>
                            <td>${u.email}</td>
                            <td>${u.phone || '-'}</td>
                            <td><span class="badge ${u.role === 'ROLE_ADMIN' ? 'warning' : 'info'}">${u.role.replace('ROLE_', '')}</span></td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td>₹${(u.walletBalance || 0).toFixed(2)}</td>
                            <td>
                                ${u.role !== 'ROLE_ADMIN' ? actionBtn : '-'}
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No users found.</td></tr>';
            }
        }

        function filterUsers() {
            const term = document.getElementById('searchBox').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.fullName || '').toLowerCase().includes(term) || 
                (u.email || '').toLowerCase().includes(term) ||
                (u.phone || '').includes(term)
            );
            renderUsers(filtered);
        }

        async function blockUser(userId) {
            if (confirm(`Are you sure you want to block this user?`)) {
                try {
                    await api.put(`/api/users/block/${userId}`);
                    showAlert(`User blocked successfully`, 'success');
                    loadUsers();
                } catch (error) {
                    showAlert(error.message || `Failed to block user`, 'danger');
                }
            }
        }

        async function unblockUser(userId) {
            if (confirm(`Are you sure you want to unblock this user?`)) {
                try {
                    await api.put(`/api/users/unblock/${userId}`);
                    showAlert(`User unblocked successfully`, 'success');
                    loadUsers();
                } catch (error) {
                    showAlert(error.message || `Failed to unblock user`, 'danger');
                }
            }
        }
    </script>
</body>
</html>
