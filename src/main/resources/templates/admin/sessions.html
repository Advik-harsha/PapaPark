<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Sessions - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper">
                <div class="stats-grid mb-4">
                    <div class="stat-card glass-panel">
                        <h3>Total Active Sessions</h3>
                        <p class="stat-value" id="activeCount">0</p>
                    </div>
                </div>

                <div class="card glass-panel">
                    <div class="card-header">
                        <h3>Active Parking Sessions</h3>
                    </div>
                    <div class="card-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Session ID</th>
                                    <th>User</th>
                                    <th>Vehicle</th>
                                    <th>Slot</th>
                                    <th>Entry Time</th>
                                    <th>Duration</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="sessionsTable">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="alertContainer"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAdmin();
            document.getElementById('pageTitle').innerText = 'Active Sessions';
            loadActiveSessions();
            
            // Refresh every 60 seconds
            setInterval(loadActiveSessions, 60000);
        });

        async function loadActiveSessions() {
            try {
                const sessions = await api.get('/api/parking/active');
                document.getElementById('activeCount').innerText = sessions ? sessions.length : 0;
                
                const tbody = document.getElementById('sessionsTable');
                tbody.innerHTML = '';
                
                if (sessions && sessions.length > 0) {
                    sessions.forEach(s => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${s.id}</td>
                                <td>${s.userName || '-'}</td>
                                <td>${s.vehicleNumber}</td>
                                <td>${s.slotNumber}</td>
                                <td>${new Date(s.entryTime).toLocaleString()}</td>
                                <td>${s.duration || calculateDuration(s.entryTime)}</td>
                                <td>
                                    <button class="btn btn-sm btn-danger" onclick="forceEndSession('${s.id}')">End Session</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">No active sessions right now.</td></tr>';
                }
            } catch (error) {
                console.error(error);
                showAlert(error.message || 'Error loading active sessions', 'danger');
            }
        }

        function calculateDuration(startTimeStr) {
            const start = new Date(startTimeStr).getTime();
            const now = new Date().getTime();
            const diffMs = now - start;
            
            const diffHrs = Math.floor(diffMs / 3600000);
            const diffMins = Math.floor((diffMs % 3600000) / 60000);
            return `${diffHrs}h ${diffMins}m`;
        }

        async function forceEndSession(sessionId) {
            if (confirm('Are you sure you want to force end this session?')) {
                try {
                    await api.post(`/api/parking/end/${sessionId}`);
                    showAlert('Session ended successfully', 'success');
                    loadActiveSessions();
                } catch (error) {
                    showAlert(error.message || 'Failed to end session', 'danger');
                }
            }
        }
    </script>
</body>
</html>
