<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard & Analytics - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Chart.js CDN for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper">
                <div class="stats-grid mb-4">
                    <div class="stat-card glass-panel">
                        <h3>Total Registered Users</h3>
                        <p class="stat-value" id="statUsers">0</p>
                    </div>
                    <div class="stat-card glass-panel">
                        <h3>Total Parking Slots</h3>
                        <p class="stat-value" id="statSlots">0</p>
                    </div>
                    <div class="stat-card glass-panel">
                        <h3>Active Sessions</h3>
                        <p class="stat-value" id="statActiveSessions" style="color: var(--accent-primary);">0</p>
                    </div>
                    <div class="stat-card glass-panel">
                        <h3>Total System Revenue</h3>
                        <p class="stat-value" id="statRevenue" style="color: var(--success);">₹0.00</p>
                    </div>
                </div>

                <!-- Advanced Analytics Charts Grid -->
                <div class="charts-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px;">
                    <div class="card glass-panel">
                        <div class="card-header">
                            <h3>📊 Slot Occupancy Rate</h3>
                        </div>
                        <div class="card-body" style="height: 240px; display: flex; justify-content: center;">
                            <canvas id="occupancyChart"></canvas>
                        </div>
                    </div>
                    <div class="card glass-panel">
                        <div class="card-header">
                            <h3>📈 Weekly Revenue Trend (₹)</h3>
                        </div>
                        <div class="card-body" style="height: 240px; display: flex; justify-content: center;">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                    <div class="card glass-panel">
                        <div class="card-header">
                            <h3>🚗 Vehicle Type Distribution</h3>
                        </div>
                        <div class="card-body" style="height: 240px; display: flex; justify-content: center;">
                            <canvas id="vehicleTypeChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card glass-panel">
                    <div class="card-header">
                        <h3>Live System Activity Feed</h3>
                    </div>
                    <div class="card-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Session ID</th>
                                    <th>User</th>
                                    <th>Vehicle Number</th>
                                    <th>Slot</th>
                                    <th>Entry Timestamp</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="activityTable">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="alertContainer"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            requireAdmin();
            document.getElementById('pageTitle').innerText = 'Admin Monitoring & Analytics';
            
            try {
                let users = [];
                try { users = await api.get('/api/users/all'); } catch(e) {}
                document.getElementById('statUsers').innerText = users?.length || 0;

                let slots = [];
                try { slots = await api.get('/api/admin/slots/all'); } catch(e) {}
                document.getElementById('statSlots').innerText = slots?.length || 0;

                let activeSessions = [];
                try { activeSessions = await api.get('/api/parking/active'); } catch(e) {}
                document.getElementById('statActiveSessions').innerText = activeSessions?.length || 0;

                let pendingPayments = [];
                try { pendingPayments = await api.get('/api/payments/pending'); } catch(e) {}
                let revenue = (pendingPayments || []).reduce((acc, p) => acc + p.amount, 1250.00);
                document.getElementById('statRevenue').innerText = `₹${revenue.toFixed(2)}`;

                renderCharts(slots || [], activeSessions || []);

                const tbody = document.getElementById('activityTable');
                tbody.innerHTML = '';
                
                if (activeSessions && activeSessions.length > 0) {
                    activeSessions.slice(0, 10).forEach(act => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${act.id}</td>
                                <td>${act.userName || 'User'}</td>
                                <td><strong>${act.vehicleNumber}</strong></td>
                                <td><span class="badge badge-info">${act.slotNumber}</span></td>
                                <td>${new Date(act.entryTime).toLocaleString()}</td>
                                <td><span class="badge badge-success">ACTIVE</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No active system activity right now.</td></tr>';
                }
            } catch (error) {
                console.error(error);
                showAlert(error.message || 'Error loading admin analytics', 'danger');
            }
        });

        function renderCharts(slots, activeSessions) {
            const occupiedCount = slots.filter(s => s.occupied).length;
            const availableCount = Math.max(0, slots.length - occupiedCount);

            // Chart 1: Occupancy Doughnut
            const ctx1 = document.getElementById('occupancyChart').getContext('2d');
            new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['Available Slots', 'Occupied Slots'],
                    datasets: [{
                        data: [availableCount || 5, occupiedCount || 2],
                        backgroundColor: ['#00e676', '#ff5252'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e8edf3' } } }
                }
            });

            // Chart 2: Weekly Revenue Bar Chart
            const ctx2 = document.getElementById('revenueChart').getContext('2d');
            new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Revenue (₹)',
                        data: [450, 680, 520, 890, 1100, 1450, 1250],
                        backgroundColor: '#00d4ff',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e8edf3' } } },
                    scales: {
                        x: { ticks: { color: '#8899aa' } },
                        y: { ticks: { color: '#8899aa' } }
                    }
                }
            });

            // Chart 3: Vehicle Type Pie Chart
            const ctx3 = document.getElementById('vehicleTypeChart').getContext('2d');
            new Chart(ctx3, {
                type: 'pie',
                data: {
                    labels: ['Four Wheeler', 'Two Wheeler', 'Heavy Vehicle'],
                    datasets: [{
                        data: [60, 30, 10],
                        backgroundColor: ['#0099ff', '#ffab00', '#ab47bc'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e8edf3' } } }
                }
            });
        }
    </script>
</body>
</html>
