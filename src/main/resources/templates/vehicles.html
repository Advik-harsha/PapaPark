<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper">
                <div class="card glass-panel">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>My Vehicles</h3>
                        <button class="btn btn-primary" onclick="openVehicleModal()">+ Add Vehicle</button>
                    </div>
                    <div class="card-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Vehicle Number</th>
                                    <th>Vehicle Type</th>
                                    <th>Model</th>
                                    <th>Color</th>
                                    <th>Parking Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="vehiclesTable">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vehicle Modal -->
    <div id="vehicleModal" class="modal-overlay">
        <div class="modal glass-panel">
            <div class="modal-header">
                <h3 id="modalTitle">Add Vehicle</h3>
                <button class="btn-close" onclick="closeVehicleModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="vehicleForm" onsubmit="saveVehicle(event)">
                    <input type="hidden" id="vehicleId">
                    <div class="form-group">
                        <label>Vehicle Number</label>
                        <input type="text" id="vehicleNumber" class="form-input" required placeholder="e.g. KA-01-AB-1234">
                    </div>
                    <div class="form-group">
                        <label>Vehicle Type</label>
                        <select id="vehicleType" class="form-select" required>
                            <option value="TWO_WHEELER">Two Wheeler</option>
                            <option value="FOUR_WHEELER">Four Wheeler</option>
                            <option value="HEAVY_VEHICLE">Heavy Vehicle</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Model</label>
                        <input type="text" id="vehicleModel" class="form-input" required placeholder="e.g. Honda City">
                    </div>
                    <div class="form-group">
                        <label>Color</label>
                        <input type="text" id="vehicleColor" class="form-input" required placeholder="e.g. Black">
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
                        <button type="button" class="btn btn-secondary" onclick="closeVehicleModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Vehicle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="alertContainer"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        let myVehiclesList = [];

        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            document.getElementById('pageTitle').innerText = 'My Vehicles';
            loadVehicles();
        });

        function formatVehicleType(type) {
            if (!type) return '-';
            switch (type) {
                case 'TWO_WHEELER': return '🏍️ Two Wheeler';
                case 'FOUR_WHEELER': return '🚗 Four Wheeler';
                case 'HEAVY_VEHICLE': return '🚚 Heavy Vehicle';
                default: return type;
            }
        }

        async function loadVehicles() {
            try {
                const userId = api.getUserId();
                const [vehicles, sessions] = await Promise.all([
                    api.get('/api/vehicles/user/' + userId),
                    api.get('/api/parking/user/' + userId).catch(() => [])
                ]);

                myVehiclesList = vehicles || [];
                const activeVehicleIds = (sessions || [])
                    .filter(s => s.status === 'ACTIVE')
                    .map(s => s.vehicleId);

                const tbody = document.getElementById('vehiclesTable');
                tbody.innerHTML = '';
                
                if (myVehiclesList.length > 0) {
                    myVehiclesList.forEach(v => {
                        const isParked = activeVehicleIds.includes(v.id);
                        const statusBadge = isParked
                            ? `<span class="badge badge-success">🟢 PARKED</span>`
                            : `<span class="badge badge-info">⚪ AVAILABLE</span>`;

                        tbody.innerHTML += `
                            <tr>
                                <td><strong style="letter-spacing: 0.5px;">${v.vehicleNumber}</strong></td>
                                <td>${formatVehicleType(v.vehicleType)}</td>
                                <td>${v.model || '-'}</td>
                                <td>${v.color || '-'}</td>
                                <td>${statusBadge}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary" onclick="editVehicleById('${v.id}')">Edit</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteVehicle('${v.id}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No registered vehicles. Click "+ Add Vehicle" to register one.</td></tr>';
                }
            } catch (error) {
                showAlert(error.message || 'Error loading vehicles', 'danger');
            }
        }

        function openVehicleModal() {
            document.getElementById('vehicleForm').reset();
            document.getElementById('vehicleId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Vehicle';
            document.getElementById('vehicleModal').classList.add('active');
        }

        function closeVehicleModal() {
            document.getElementById('vehicleModal').classList.remove('active');
        }

        function editVehicleById(id) {
            const v = myVehiclesList.find(item => item.id === id);
            if (!v) return;

            document.getElementById('vehicleId').value = v.id;
            document.getElementById('vehicleNumber').value = v.vehicleNumber || '';
            document.getElementById('vehicleType').value = v.vehicleType || 'FOUR_WHEELER';
            document.getElementById('vehicleModel').value = v.model || '';
            document.getElementById('vehicleColor').value = v.color || '';
            document.getElementById('modalTitle').innerText = 'Edit Vehicle';
            document.getElementById('vehicleModal').classList.add('active');
        }

        async function saveVehicle(e) {
            e.preventDefault();
            const id = document.getElementById('vehicleId').value;
            const payload = {
                vehicleNumber: document.getElementById('vehicleNumber').value.trim(),
                vehicleType: document.getElementById('vehicleType').value,
                model: document.getElementById('vehicleModel').value.trim(),
                color: document.getElementById('vehicleColor').value.trim()
            };
            const userId = api.getUserId();

            try {
                if (id) {
                    await api.put(`/api/vehicles/update/${id}`, payload);
                    showAlert('Vehicle updated successfully', 'success');
                } else {
                    await api.post(`/api/vehicles/add?userId=${userId}`, payload);
                    showAlert('Vehicle registered successfully', 'success');
                }
                closeVehicleModal();
                loadVehicles();
            } catch (error) {
                showAlert(error.message || 'Failed to save vehicle', 'danger');
            }
        }

        async function deleteVehicle(id) {
            if (confirm('Are you sure you want to delete this vehicle?')) {
                try {
                    await api.delete(`/api/vehicles/delete/${id}`);
                    showAlert('Vehicle deleted successfully', 'success');
                    loadVehicles();
                } catch (error) {
                    showAlert(error.message || 'Failed to delete vehicle', 'danger');
                }
            }
        }
    </script>
</body>
</html>
