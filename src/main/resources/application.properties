# Server Configuration
server.port=8080

# Application Name
spring.application.name=smart-parking-system

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/smart_parking_db
spring.data.mongodb.auto-index-creation=true

# JWT Secret (Should be at least 256 bits, this is base64 encoded for demonstration)
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration-ms=86400000

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
