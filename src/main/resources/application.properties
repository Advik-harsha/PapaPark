# Server Configuration
server.port=8080

# Application Name
spring.application.name=smart-parking-system

# MongoDB Configuration (Supports MongoDB Atlas cloud connection URI via environment variable or application.properties)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/smart_parking_db}
spring.data.mongodb.auto-index-creation=true

# Mail Server Configuration (Optional for real SMTP, falls back to console logger)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:smartpark@gmail.com}
spring.mail.password=${MAIL_PASSWORD:app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Secret Configuration
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration-ms=86400000

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
